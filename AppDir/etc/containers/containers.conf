# podman resolves conmon and the OCI runtime from absolute paths plus $PATH,
# before helper_binaries_dir is consulted, and $BINDIR is only expanded for
# helper binaries. So name this launch's mount directly: the mount path below
# is substituted by 01-distrobox-paths.hook when the file is copied out of
# the mount, and it is rewritten on every launch so it cannot go stale
[engine]
helper_binaries_dir = ["$BINDIR"]
conmon_path = ["@APPDIR@/bin/conmon"]
runtime = "crun"

[engine.runtimes]
crun = ["@APPDIR@/bin/crun"]
